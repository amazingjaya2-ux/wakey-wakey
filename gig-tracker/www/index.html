<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MileMoney</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="backdrop-art" aria-hidden="true"><i></i><i></i><i></i></div>

  <main id="app">
    <!-- HOME -->
    <section class="view active" id="view-home" aria-label="Overview">
      <header class="title-row">
        <h1>Overview</h1>
        <span class="title-actions">
          <button class="pro-pill press" id="remove-ads" hidden>Remove ads</button>
          <span class="sync-pill" id="sync-pill" hidden></span>
        </span>
      </header>

      <div class="seg glass" id="period"></div>

      <div class="tracker glass press" id="tracker" role="button" tabindex="0">
        <span class="tracker-dot" aria-hidden="true"></span>
        <div class="tracker-text">
          <div class="tracker-title" id="trk-title">Start shift</div>
          <div class="tracker-sub" id="trk-status">Counts your miles with GPS</div>
        </div>
        <span class="tracker-go" id="trk-icon" aria-hidden="true"></span>
      </div>
      <div id="auto-row"></div>
      <div id="drives-card"></div>

      <div class="hero">
        <div class="eyebrow" id="hero-label">Earned this week</div>
        <div class="hero-num" id="k-gross">$0.00</div>
        <div class="hero-sub" id="k-net"></div>
      </div>

      <div class="tiles" id="tiles"></div>

      <div id="goal-card"></div>

      <div class="card" id="chart-card">
        <div class="card-h"><span>Last 8 weeks</span></div>
        <div id="chart" class="chart"></div>
      </div>

      <div class="card" id="by-app-card">
        <div class="card-h"><span>Best paying app</span></div>
        <div id="by-app"></div>
      </div>

      <div class="card" id="best-days-card">
        <div class="card-h"><span>Best days to drive</span></div>
        <div id="best-days"></div>
      </div>

      <div id="home-locked"></div>
    </section>

    <!-- ACTIVITY -->
    <section class="view" id="view-activity" aria-label="Activity">
      <header class="title-row"><h1>Activity</h1></header>
      <div class="seg glass" id="act-seg"></div>
      <div id="act-list"></div>
    </section>

    <!-- TAXES -->
    <section class="view" id="view-taxes" aria-label="Taxes">
      <header class="title-row">
        <h1>Taxes</h1>
        <label class="year-pick glass press"><select id="tax-year" aria-label="Tax year"></select></label>
      </header>
      <div id="tax-body"></div>
    </section>

    <!-- ACCOUNT -->
    <section class="view" id="view-account" aria-label="Account">
      <header class="title-row"><h1>Account</h1></header>
      <div id="account-body"></div>
      <div id="settings-body"></div>
    </section>
  </main>

  <nav class="dock glass" id="dock" aria-label="Main">
    <span class="dock-ind" id="dock-ind" aria-hidden="true"></span>
    <button class="dock-btn press active" data-view="home" aria-label="Overview"></button>
    <button class="dock-btn press" data-view="activity" aria-label="Activity"></button>
    <button class="dock-add press" id="add-btn" aria-label="Add"></button>
    <button class="dock-btn press" data-view="taxes" aria-label="Taxes"></button>
    <button class="dock-btn press" data-view="account" aria-label="Account"></button>
  </nav>

  <div class="sheet-wrap" id="sheet" hidden>
    <div class="sheet-scrim" data-close></div>
    <div class="sheet glass" role="dialog" aria-modal="true">
      <div class="grabber" data-close></div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div class="toast glass" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="vendor/capacitor.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="store.js"></script>
  <script src="sync.js"></script>
  <script src="monetize.js"></script>
  <script src="receipts.js"></script>
  <script src="autotrack.js"></script>
  <script src="app.js"></script>
</body>
</html>
