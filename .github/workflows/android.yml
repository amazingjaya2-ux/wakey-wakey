name: Build Android app

on:
  push:
    branches: [main, gig-tracker-app]
    paths: ['gig-tracker/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gig-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gig-tracker/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: gig-tracker/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MileMoney-debug-apk
          path: gig-tracker/android/app/build/outputs/apk/debug/app-debug.apk
